<!doctype html>
<html lang="es" data-modo="noche">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boceto · Caminos en Mapas</title>
<style>
/*
 * Boceto estático de Caminos en Mapas. No se conecta a nada, no lee archivos
 * y no es código de la app. Los colores salen de variables con los mismos
 * nombres que la app, en los dos modos.
 */
:root,
:root[data-modo="noche"] {
  --fondo: #0f172a;
  --superficie: #1e293b;
  --superficie-alta: #334155;
  --borde: #334155;
  --borde-fuerte: #8795ab;
  --texto: #f1f5f9;
  --texto-suave: #aab8c9;
  --acento: #1b4332;
  --acento-hover: #14532d;
  --acento-texto: #d8f3dc;
  --acento-borde: #047857;
  --dato: #67e8f9;
  --rojo-texto: #fca5a5;
  --rojo-fondo: #351620;
  --rojo-fondo-fuerte: #4a1b22;
  --rojo-borde: #991b1b;
  --ambar-texto: #fde68a;
  --ambar-fondo: #33250f;
  --ambar-borde: #b45309;
  --verde-texto: #6ee7b7;
  --verde-fondo: #0d3b2e;
  --verde-borde: #059669;
  --mapa-fondo: #16202f;
  --mapa-relieve: #24324a;
  --anotacion: #f472b6;
  --parte-facil: #2de083;
  --parte-media: #ffd43b;
  --parte-dificil: #ff6262;
  --parte-sin-clasificar: #cbd5e1;
  --parte-x: #111827;
  --parte-x-halo: #ffffff;
  /* Borde de cada línea de un Camino: en modo noche casi no se nota. */
  --linea-borde: #0b1220;
  /* Caminos que no sirven para la actividad elegida: finos y apagados. */
  --otra-actividad: #7c8aa0;
  --zona-borde: #aab8c9;
  --velo: rgb(0 0 0 / 0.72);
  --sombra: 0 1px 2px rgb(0 0 0 / 0.4);
  --sombra-alta: 0 4px 12px rgb(0 0 0 / 0.45);
  color-scheme: dark;
}

:root[data-modo="sol"] {
  --fondo: #f8fafc;
  --superficie: #ffffff;
  --superficie-alta: #e2e8f0;
  --borde: #cbd5e1;
  --borde-fuerte: #64748b;
  --texto: #0f172a;
  --texto-suave: #475569;
  --acento: #1b4332;
  --acento-hover: #14532d;
  --acento-texto: #d8f3dc;
  --acento-borde: #14532d;
  --dato: #0c4a6e;
  --rojo-texto: #6b1616;
  --rojo-fondo: #fee2e2;
  --rojo-fondo-fuerte: #fecaca;
  --rojo-borde: #b91c1c;
  --ambar-texto: #78350f;
  --ambar-fondo: #fef3c7;
  --ambar-borde: #b45309;
  --verde-texto: #064e3b;
  --verde-fondo: #d1fae5;
  --verde-borde: #047857;
  --mapa-fondo: #e8eef4;
  --mapa-relieve: #cfd9e4;
  --anotacion: #be185d;
  /* Con el borde oscuro de la línea, el color puede ser el de verdad: el
     amarillo sigue siendo amarillo y el contraste lo da el borde. */
  --parte-facil: #16a34a;
  --parte-media: #eab308;
  --parte-dificil: #dc2626;
  --parte-sin-clasificar: #94a3b8;
  --parte-x: #111827;
  --parte-x-halo: #ffffff;
  --linea-borde: #0f172a;
  --otra-actividad: #475569;
  --zona-borde: #475569;
  --velo: rgb(15 23 42 / 0.55);
  --sombra: 0 1px 2px rgb(15 23 42 / 0.12);
  --sombra-alta: 0 4px 12px rgb(15 23 42 / 0.16);
  color-scheme: light;
}

/* Los colores de trazo son del dato, no del modo (como en la app). */
:root {
  --trazo-agua: #0ea5e9;
  --trazo-huella: #f97316;
  --trazo-limite: #a855f7;
  --trazo-peligro: #ef4444;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--fondo);
  color: var(--texto);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 16px;
  line-height: 1.5;
}
h1, h2, h3, h4, p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }

/* ------------------------------------------------ controles del boceto */
.boceto-barra {
  position: relative; z-index: 30;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding: 10px 16px;
  background: var(--superficie-alta);
  border-bottom: 2px dashed var(--dato);
}
.boceto-barra .rotulo { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--dato); }
.boceto-barra .grupo { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.boceto-barra .grupo > span { font-size: 14px; color: var(--texto-suave); }

.nota-boceto {
  border: 2px dashed var(--dato);
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 14px;
  color: var(--texto);
  background: transparent;
}
.nota-boceto::before {
  content: "Nota del boceto · ";
  font-weight: 700;
  color: var(--dato);
}

/* ------------------------------------------------ armazón de la app */
.app { display: grid; grid-template-columns: 210px minmax(0, 1fr); min-height: 100vh; }
.menu { background: var(--superficie); border-right: 1px solid var(--borde); padding: 16px 12px; }
.marca { font-weight: 800; font-size: 20px; margin: 0 8px 16px; }
.menu nav { display: grid; gap: 4px; }
.menu nav span {
  display: block; padding: 8px 12px; border-radius: 12px; font-size: 15px; color: var(--texto-suave);
}
.menu nav span.activo { background: var(--superficie-alta); color: var(--texto); font-weight: 600; }
main { padding: 20px 24px 40px; min-width: 0; }
.encabezado { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.encabezado h1 { font-size: 24px; font-weight: 800; text-transform: uppercase; }
.pestanas { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }

/* ------------------------------------------------ piezas compartidas */
.boton {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 8px 16px;
  border-radius: 12px; border: 1px solid transparent;
  font-size: 14px; font-weight: 600; cursor: pointer;
  transition: background-color .15s;
}
.boton:focus-visible, .opcion:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--dato); outline-offset: 2px;
}
.boton:disabled { opacity: .5; cursor: not-allowed; }
.principal { background: var(--acento); color: var(--acento-texto); border-color: var(--acento-borde); }
.principal:hover:not(:disabled) { background: var(--acento-hover); }
.secundario { background: var(--superficie-alta); color: var(--texto); border-color: var(--borde-fuerte); }
.secundario:hover:not(:disabled) { background: var(--superficie); }
.destructivo { background: var(--rojo-fondo); color: var(--rojo-texto); border-color: var(--rojo-borde); }
.destructivo:hover:not(:disabled) { background: var(--rojo-fondo-fuerte); }
.fantasma { background: transparent; color: var(--texto-suave); }
.fantasma:hover { background: var(--superficie-alta); color: var(--texto); }
.boton svg { width: 18px; height: 18px; }

.tarjeta {
  background: var(--superficie); border: 1px solid var(--borde);
  border-radius: 16px; padding: 16px; box-shadow: var(--sombra);
}
.franja-ambar { border-left: 6px solid var(--ambar-borde); }
.franja-rojo { border-left: 6px solid var(--rojo-borde); }
.franja-verde { border-left: 6px solid var(--verde-borde); }
.aviso-ambar { background: var(--ambar-fondo); color: var(--ambar-texto); border: 1px solid var(--ambar-borde); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.aviso-rojo { background: var(--rojo-fondo); color: var(--rojo-texto); border: 1px solid var(--rojo-borde); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.aviso-verde { background: var(--verde-fondo); color: var(--verde-texto); border: 1px solid var(--verde-borde); border-radius: 12px; padding: 10px 12px; font-size: 14px; }

.titulo-seccion { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--texto-suave); margin-bottom: 8px; }
.suave { color: var(--texto-suave); }
.chico { font-size: 14px; }
.pila > * + * { margin-top: 12px; }
.pila-chica > * + * { margin-top: 6px; }
.fila { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.entre { justify-content: space-between; }

.opciones { display: grid; gap: 6px; }
.opciones.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opciones.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.opciones.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.opciones.c5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.opcion {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 8px 10px;
  border-radius: 12px; border: 1px solid var(--borde-fuerte);
  background: var(--superficie); color: var(--texto);
  font-size: 14px; font-weight: 600; cursor: pointer; text-align: center;
}
.opcion[aria-pressed="true"] { background: var(--acento); color: var(--acento-texto); border-color: var(--acento-borde); }
.opcion:disabled { opacity: .5; cursor: not-allowed; }

label.campo { display: block; font-size: 14px; font-weight: 500; color: var(--texto-suave); margin-bottom: 6px; }
input[type="text"], input[type="date"], textarea {
  width: 100%; min-height: 40px; padding: 8px 12px;
  border-radius: 12px; border: 1px solid var(--borde-fuerte);
  background: var(--fondo); color: var(--texto); font-size: 16px;
}
textarea { min-height: 88px; resize: vertical; }
input:disabled, textarea:disabled { opacity: .6; }
.contador { font-size: 13px; color: var(--texto-suave); text-align: right; margin-top: 4px; }
.contador.pasado { color: var(--rojo-texto); font-weight: 700; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
  border: 1px solid var(--borde-fuerte); color: var(--texto);
}
.chip.destacada { background: var(--acento); color: var(--acento-texto); border-color: var(--acento-borde); }

/* ------------------------------------------------ mapas */
.mapa-caja {
  position: relative; border-radius: 16px; overflow: hidden;
  border: 1px solid var(--borde); background: var(--mapa-fondo);
}
.mapa-caja svg { display: block; width: 100%; height: auto; }
.mapa-caja .controles {
  position: absolute; right: 12px; bottom: 12px;
  display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
}
.mapa-caja .controles .boton { min-width: 40px; padding: 8px 10px; box-shadow: var(--sombra-alta); }
.mapa-caja.en-grande {
  position: fixed; inset: 12px; z-index: 40; border-radius: 16px; box-shadow: var(--sombra-alta);
  display: flex; align-items: center; justify-content: center;
}
.mapa-caja.en-grande svg { width: auto; height: 100%; max-width: 100%; }
.leyenda { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 14px; color: var(--texto-suave); margin-top: 8px; }
.leyenda b { color: var(--texto); font-weight: 600; }
.leyenda .item { display: inline-flex; align-items: center; gap: 6px; }
.muestra { width: 34px; height: 12px; }
.tocable { cursor: pointer; }
.etiqueta-mapa { font-size: 16px; font-weight: 600; fill: var(--texto); paint-order: stroke; stroke: var(--mapa-fondo); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.etiqueta-zona { font-size: 17px; font-weight: 700; fill: var(--zona-borde); paint-order: stroke; stroke: var(--mapa-fondo); stroke-width: 4px; cursor: pointer; }

/* ------------------------------------------------ distribuciones */
.mapa-con-ficha { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.traer { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 0.9fr); gap: 16px; align-items: start; }
.traer .vista-previa { position: sticky; top: 16px; }
.editor { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 16px; align-items: start; }
.editor-partes { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
.galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; align-items: start; }

.linea-a-traer { border: 1px solid var(--borde); border-radius: 14px; padding: 12px; background: var(--superficie); }
.linea-a-traer.enfocada { border-color: var(--dato); box-shadow: 0 0 0 2px var(--dato); }
.linea-a-traer .cabeza { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.numero { width: 26px; height: 26px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; background: var(--superficie-alta); }
.color-earth { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--texto-suave); }
.color-earth i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; border: 1px solid var(--borde-fuerte); }
.estado-pill { margin-left: auto; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.estado-pill.falta { background: var(--ambar-fondo); color: var(--ambar-texto); border: 1px solid var(--ambar-borde); }
.estado-pill.listo { background: var(--verde-fondo); color: var(--verde-texto); border: 1px solid var(--verde-borde); }
.estado-pill.omitida { background: var(--superficie-alta); color: var(--texto-suave); border: 1px solid var(--borde-fuerte); }

.lista-partes { display: grid; gap: 6px; }
.renglon-parte {
  display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center;
  padding: 8px 10px; border-radius: 12px; border: 1px solid var(--borde); background: var(--superficie);
  cursor: pointer; text-align: left; width: 100%;
}
.renglon-parte[aria-pressed="true"] { border-color: var(--dato); box-shadow: 0 0 0 2px var(--dato); }
.tabla-actividades { width: 100%; border-collapse: collapse; font-size: 14px; }
.tabla-actividades td { padding: 6px 0; border-top: 1px solid var(--borde); vertical-align: top; }
.tabla-actividades td:first-child { color: var(--texto-suave); width: 42%; padding-right: 8px; }
.permisos { width: 100%; border-collapse: collapse; font-size: 14px; }
.permisos th, .permisos td { border-top: 1px solid var(--borde); padding: 8px 6px; text-align: left; }
.permisos th { color: var(--texto-suave); font-weight: 600; }
.esqueleto { height: 14px; border-radius: 8px; background: var(--superficie-alta); }
.oculto { display: none !important; }

/* ------------------------------------------------ emergente única */
.velo { position: fixed; inset: 0; background: var(--velo); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
.emergente { width: min(460px, 100%); background: var(--superficie); border: 1px solid var(--borde-fuerte); border-radius: 16px; padding: 20px; box-shadow: var(--sombra-alta); }
.emergente h2 { font-size: 18px; margin-bottom: 8px; }
.emergente .botones { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

@media (max-width: 1100px) {
  .mapa-con-ficha, .traer, .editor, .editor-partes { grid-template-columns: minmax(0, 1fr); }
  .traer .vista-previa { position: static; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .menu { display: none; }
  main { padding: 16px; }
  .opciones.c5, .opciones.c4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>
<body>

<div class="boceto-barra" role="region" aria-label="Controles del boceto">
  <span class="rotulo">Boceto · no es la app</span>
  <div class="grupo">
    <span>Situación:</span>
    <button class="opcion" data-accion="situacion" data-valor="1" aria-pressed="true">1 · Mapa general</button>
    <button class="opcion" data-accion="situacion" data-valor="2" aria-pressed="false">2 · Traer de afuera</button>
    <button class="opcion" data-accion="situacion" data-valor="2b" aria-pressed="false">2b · Archivo con puntos (ejemplo)</button>
    <button class="opcion" data-accion="situacion" data-valor="3" aria-pressed="false">3 · Editor del Camino</button>
    <button class="opcion" data-accion="situacion" data-valor="4" aria-pressed="false">4 · Editor de partes</button>
    <button class="opcion" data-accion="situacion" data-valor="5" aria-pressed="false">5 · Permisos y estados</button>
  </div>
  <div class="grupo">
    <span>Ver como:</span>
    <button class="opcion" data-accion="rol" data-valor="administrador" aria-pressed="true">Administrador</button>
    <button class="opcion" data-accion="rol" data-valor="premium_autor" aria-pressed="false">Premium que lo subió</button>
    <button class="opcion" data-accion="rol" data-valor="premium_otro" aria-pressed="false">Otro Premium</button>
    <button class="opcion" data-accion="rol" data-valor="normal" aria-pressed="false">Normal</button>
  </div>
  <button class="boton fantasma" data-accion="reiniciar">Reiniciar el boceto</button>
</div>

<div class="app">
  <aside class="menu" aria-label="Menú de la app">
    <div class="marca">TrackApp</div>
    <nav>
      <span>Rutas</span>
      <span>Navegación libre</span>
      <span class="activo">Mapas</span>
      <span>Salidas</span>
      <span>Perfiles</span>
    </nav>
  </aside>

  <main>
    <div class="encabezado">
      <h1>Mapas</h1>
      <div class="fila">
        <span class="chico suave" id="quien-usa"></span>
        <button class="boton secundario" data-accion="modo" id="boton-modo"></button>
      </div>
    </div>

    <div class="pestanas" role="tablist" aria-label="Vistas de Mapas">
      <button class="boton" data-accion="pestana" data-valor="zonas" id="pestana-zonas">Zonas</button>
      <button class="boton" data-accion="pestana" data-valor="mapa" id="pestana-mapa">Mapa</button>
      <button class="boton" data-accion="pestana" data-valor="caminos" id="pestana-caminos">Caminos</button>
      <button class="boton" data-accion="pestana" data-valor="anotaciones" id="pestana-anotaciones">Anotaciones</button>
      <button class="boton" data-accion="pestana" data-valor="descargas" id="pestana-descargas">Descargas</button>
    </div>

    <section id="vista-mapa"></section>
    <section id="vista-caminos"></section>
    <section id="vista-traer"></section>
    <section id="vista-editor"></section>
    <section id="vista-estados"></section>
    <section id="vista-anotaciones"></section>
    <section id="vista-otra"></section>
  </main>
</div>

<div class="velo oculto" id="velo" data-accion="cerrar-emergente-afuera">
  <div class="emergente" role="dialog" aria-modal="true" aria-labelledby="emergente-titulo" id="emergente"></div>
</div>

<noscript><p style="padding:16px">Este boceto necesita JavaScript para pasar de una vista a otra.</p></noscript>

<script>
"use strict";

// ---------------------------------------------------------------- datos de ejemplo
// Forma real de las siete líneas del proyecto de Ascochinga, achicada a

function largoPx(arr) {
  let total = 0;
  for (let i = 1; i < arr.length; i += 1) total += Math.hypot(arr[i][0] - arr[i - 1][0], arr[i][1] - arr[i - 1][1]);
  return total;
}
function puntoA(arr, distancia) {
  let acumulado = 0;
  for (let i = 1; i < arr.length; i += 1) {
    const tramo = Math.hypot(arr[i][0] - arr[i - 1][0], arr[i][1] - arr[i - 1][1]);
    if (acumulado + tramo >= distancia) {
      const t = tramo ? (distancia - acumulado) / tramo : 0;
      return [arr[i - 1][0] + (arr[i][0] - arr[i - 1][0]) * t, arr[i - 1][1] + (arr[i][1] - arr[i - 1][1]) * t];
    }
    acumulado += tramo;
  }
  return arr[arr.length - 1];
}
function equis(arr) {
  const largo = largoPx(arr);
  const cantidad = Math.max(1, Math.round(largo / 70));
  let svg = "";
  for (let i = 0; i < cantidad; i += 1) {
    const [x, y] = puntoA(arr, (largo * (i + 0.5)) / cantidad);
    svg += `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})" pointer-events="none">
      <path d="M-6 -6L6 6M6 -6L-6 6" stroke="var(--parte-x-halo)" stroke-width="7" stroke-linecap="round"/>
      <path d="M-6 -6L6 6M6 -6L-6 6" stroke="var(--parte-x)" stroke-width="3.2" stroke-linecap="round"/></g>`;
  }
  return svg;
}
/** Una parte clasificada: borde, color por complejidad, forma por condición, X si no hay paso. */
function lineaDeParte(arr, clasificacion, ancho = 6) {
  const dash = DASH[clasificacion.paso];
  const atributo = dash ? ` stroke-dasharray="${dash}"` : "";
  return `<polyline points="${pts(arr)}" fill="none" stroke="var(--linea-borde)" stroke-width="${ancho + 4}" stroke-linecap="round" stroke-linejoin="round"${atributo}/>
    <polyline points="${pts(arr)}" fill="none" stroke="${colorComplejidad(clasificacion.comp)}" stroke-width="${ancho}" stroke-linecap="round" stroke-linejoin="round"${atributo}/>
    ${clasificacion.paso === "sin_paso" ? equis(arr) : ""}`;
}
function muestraDeLinea(paso, comp) {
  const arr = [[3, 6], [31, 6]];
  return `<svg class="muestra" viewBox="0 0 34 12" aria-hidden="true">${lineaDeParte(arr, cl(paso, comp), 4).replace(/stroke-width="8"/g, 'stroke-width="7"')}</svg>`;
}
function iconoSvg(icono, x, y, grande) {
  if (!grande) return `<circle cx="${x}" cy="${y}" r="5" fill="var(--anotacion)" stroke="var(--parte-x-halo)" stroke-width="1.5"/>`;
  return `<g transform="translate(${x} ${y})"><circle r="12" fill="var(--anotacion)" stroke="var(--parte-x-halo)" stroke-width="2"/>
    <g transform="translate(-8.4 -8.4) scale(0.7)"><path d="${ICONOS[icono].trazo}" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g>`;
}
function relieve(ancho, alto) {
  let svg = "";
  for (let i = 0; i < 9; i += 1) {
    const y0 = 40 + i * (alto / 9);
    let d = `M0 ${y0.toFixed(1)}`;
    for (let x = 0; x <= ancho; x += 50) d += ` L${x} ${(y0 + 14 * Math.sin(x / 90 + i)).toFixed(1)}`;
    svg += `<path d="${d}" fill="none" stroke="var(--mapa-relieve)" stroke-width="1.5"/>`;
  }
  return svg;
}

// ---------------------------------------------------------------- vista: mapa general
/** Encuadra unos puntos en el mapa: lo que hay que mirar, no lo que se estaba mirando. */
function encuadre(base, ancho, alto, margen) {
  const xs = base.map((p) => p[0]);
  const ys = base.map((p) => p[1]);
  const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const escala = Math.min((ancho - 2 * margen) / Math.max(x1 - x0, 1), (alto - 2 * margen) / Math.max(y1 - y0, 1), 8);
  const cx = (x0 + x1) / 2;
  const cy = (y0 + y1) / 2;
  return (p) => [(p[0] - cx) * escala + ancho / 2, (p[1] - cy) * escala + alto / 2];
}
function transformacion() {
  if (estado.acercamiento === "lejos") return (p) => p;
  const sel = estado.seleccion?.tipo === "camino" ? caminosVivos().find((c) => c.id === estado.seleccion.id) : null;
  if (!sel) return (p) => [(p[0] - 520) * 2.1 + 500, (p[1] - 330) * 2.1 + 310];
  return encuadre(L(sel.linea), 1000, 620, 110);
}

function svgMapaGeneral() {
  const tf = transformacion();
  const cerca = estado.acercamiento === "cerca";
  const principal = estado.actividadPrincipal;
  const sel = estado.seleccion;
  let svg = `<svg viewBox="0 0 1000 620" role="img" aria-label="Mapa general con Caminos, puntos y trazos">
    <rect width="1000" height="620" fill="var(--mapa-fondo)"/>${relieve(1000, 620)}`;

  // La zona: solo su perímetro y su nombre. No ordena Caminos.
  const [z1, z2] = [tf([318, 26]), tf([682, 594])];
  svg += `<rect x="${z1[0]}" y="${z1[1]}" width="${z2[0] - z1[0]}" height="${z2[1] - z1[1]}" fill="none" stroke="var(--zona-borde)" stroke-width="2" stroke-dasharray="8 6"/>
    <text class="etiqueta-zona" x="${z1[0] + 10}" y="${z1[1] + 22}" data-accion="tocar-zona">Sierras Chicas (ejemplo)</text>`;

  for (const trazo of trazosVivos()) {
    const arr = trazo.p.map(tf);
    const color = TRAZOS_COLOR.find((c) => c.id === trazo.color).color;
    svg += `<polyline points="${pts(arr)}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="${pts(arr)}" fill="none" stroke="transparent" stroke-width="16" class="tocable" pointer-events="stroke" data-accion="tocar-trazo" data-id="${trazo.id}"/>`;
  }

  const ordenados = [...caminosVivos()].sort((a, b) => Number(a.actividades.includes(principal)) - Number(b.actividades.includes(principal)));
  for (const camino of ordenados) {
    const linea = L(camino.linea).map(tf);
    const sirve = camino.actividades.includes(principal);
    const elegido = sel?.tipo === "camino" && sel.id === camino.id;
    if (elegido) svg += `<polyline points="${pts(linea)}" fill="none" stroke="var(--dato)" stroke-width="18" stroke-opacity="0.35" stroke-linecap="round" stroke-linejoin="round"/>`;
    camino.partes.forEach((parte, i) => {
      const arr = linea.slice(parte.desde, parte.hasta + 1);
      svg += sirve
        ? lineaDeParte(arr, parte.por[principal])
        : `<polyline points="${pts(arr)}" fill="none" stroke="var(--otra-actividad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
      if (elegido && sel.parte === i) {
        svg += `<polyline points="${pts(arr)}" fill="none" stroke="var(--dato)" stroke-width="2" stroke-dasharray="2 4" pointer-events="none"/>`;
      }
      svg += `<polyline points="${pts(arr)}" fill="none" stroke="transparent" stroke-width="18" class="tocable" pointer-events="stroke" data-accion="tocar-camino" data-id="${camino.id}" data-parte="${i}"><title>${esc(camino.nombre)}</title></polyline>`;
    });
    if (cerca) {
      const medio = linea[Math.floor(linea.length / 2)];
      svg += `<text class="etiqueta-mapa" x="${medio[0] + 10}" y="${medio[1] - 8}">${esc(camino.nombre)}</text>`;
    }
  }

  for (const punto of puntosVivos()) {
    const [x, y] = tf(punto.pos);
    svg += `<g class="tocable" data-accion="tocar-punto" data-id="${punto.id}">${iconoSvg(punto.icono, x.toFixed(1), y.toFixed(1), cerca)}<title>${esc(punto.nombre)}</title></g>`;
    if (cerca) svg += `<text class="etiqueta-mapa" x="${x + 16}" y="${y + 5}">${esc(punto.nombre)}</text>`;
  }
  return svg + "</svg>";
}

  if (sel.tipo === "trazo") {
    const trazo = trazosVivos().find((t) => t.id === sel.id);
    if (!trazo) return `<div class="tarjeta"><p class="suave">Ese trazo ya no está en el mapa.</p></div>`;
    return `<div class="tarjeta pila"><p class="titulo-seccion">Trazo · ${esc(TRAZOS_COLOR.find((c) => c.id === trazo.color).nombre)}</p>

  }
  const camino = caminosVivos().find((c) => c.id === sel.id);

  const acciones = puedeEditar(camino)
    ? `<div class="fila"><button class="boton secundario" data-accion="abrir-editor" data-valor="datos">Editar Camino</button>
       <button class="boton secundario" data-accion="abrir-editor" data-valor="partes">Editar partes</button></div>`
    : estado.rol === "normal"
      ? `<p class="chico suave">Tu cuenta puede ver los Caminos, pero no cambiarlos.</p>`

    <div><p class="titulo-seccion">Camino</p><h3>${esc(camino.nombre)}</h3></div>
    <div class="fila">${chips}</div>
    ${camino.actividades.includes(principal) ? "" : `<p class="aviso-ambar">No está marcado para ${esc(nombreActividad(principal))}: por eso se ve fino y apagado. Sirve para las actividades de arriba.</p>`}
    <p class="chico suave">Lo subió ${esc(AUTORES[camino.autor])} · ${km(GEO.lineas[camino.linea].km)} · ${camino.partes.length} ${camino.partes.length === 1 ? "parte" : "partes"}</p>
    <div class="pila-chica">
      <p class="titulo-seccion">Parte ${(sel.parte ?? 0) + 1} de ${camino.partes.length} · del km ${acum[parte.desde].toFixed(1).replace(".", ",")} al ${acum[parte.hasta].toFixed(1).replace(".", ",")}</p>
      <table class="tabla-actividades"><tbody>${filas}
        <tr><td>Observación</td><td>${parte.obs ? esc(parte.obs) : '<span class="suave">Sin observación</span>'}</td></tr>
        <tr><td>Comprobado el</td><td>${parte.fecha ? fechaEnPalabras(parte.fecha) : '<span class="suave">Sin fecha</span>'}</td></tr>
      </tbody></table>
      <p class="chico suave">Tocá otra parte de la línea para ver la suya.</p>
    </div>
    ${acciones}
  </div>`;
}

// ---------------------------------------------------------------- vista: traer de afuera
function nuevoTraer(archivo) {
  return {
    archivo,
    decisiones: {},
    nombres: ARCHIVOS[archivo].lineas.map((l) => l.nombre),
    colores: {},
    actividades: [],
    puntos: {},
    iconos: Object.fromEntries(ARCHIVOS[archivo].puntos.map((p, i) => [i, p.icono])),
    foco: null,
    incorporado: false,
  };
}

/** «a», «a y b», «a, b y c». */
function enLista(partes) {
  return partes.length <= 1 ? partes.join("") : `${partes.slice(0, -1).join(", ")} y ${partes.at(-1)}`;
}
const cuenta = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;

function resumenTraer() {
  const t = estado.traer;
  const archivo = ARCHIVOS[t.archivo];
  const lineas = archivo.lineas.map((_, i) => i);
  const puntos = archivo.puntos.map((_, i) => i);
  const caminos = lineas.filter((i) => t.decisiones[i] === "camino").length;
  const trazos = lineas.filter((i) => t.decisiones[i] === "trazo").length;
  const lineasOmitidas = lineas.filter((i) => t.decisiones[i] === "omitir").length;
  const puntosSumados = puntos.filter((i) => t.puntos[i] === "sumar").length;
  const puntosOmitidos = puntos.filter((i) => t.puntos[i] === "omitir").length;
  const faltanLineas = lineas.filter((i) => !t.decisiones[i]);
  const faltanPuntos = puntos.filter((i) => !t.puntos[i]);
  const trazosSinColor = lineas.filter((i) => t.decisiones[i] === "trazo" && !t.colores[i]);
  const sinNombre = lineas.filter((i) => t.decisiones[i] && t.decisiones[i] !== "omitir" && !t.nombres[i].trim());
  const largos = lineas.filter((i) => t.decisiones[i] !== "omitir" && caracteres(t.nombres[i].trim()) > 120);
  const decididos = lineas.length - faltanLineas.length + puntos.length - faltanPuntos.length;
  const total = caminos + trazos + puntosSumados;

  const problemas = [];
  if (faltanLineas.length) problemas.push(`Falta decidir ${faltanLineas.length === 1 ? "la línea" : "las líneas"} ${enLista(faltanLineas.map((i) => String(i + 1)))}.`);
  if (faltanPuntos.length) problemas.push(`Falta decidir ${faltanPuntos.length === 1 ? "el punto" : "los puntos"} ${enLista(faltanPuntos.map((i) => `P${i + 1}`))}.`);
  if (trazosSinColor.length) problemas.push(`Elegí el color del trazo en ${enLista(trazosSinColor.map((i) => `la línea ${i + 1}`))}.`);
  if (caminos > 0 && t.actividades.length === 0) problemas.push("Elegí al menos una actividad para los Caminos nuevos.");
  if (sinNombre.length) problemas.push(`Ponele nombre a ${enLista(sinNombre.map((i) => `la línea ${i + 1}`))}.`);
  if (largos.length) problemas.push(`El nombre de ${enLista(largos.map((i) => `la línea ${i + 1}`))} pasa los 120 caracteres: acortalo.`);
  if (!faltanLineas.length && !faltanPuntos.length && total === 0) problemas.push("Elegiste omitir todo: no queda nada para sumar.");

  const vaASumar = [];
  if (caminos) vaASumar.push(cuenta(caminos, "Camino", "Caminos"));
  if (trazos) vaASumar.push(cuenta(trazos, "trazo", "trazos"));
  if (puntosSumados) vaASumar.push(cuenta(puntosSumados, "punto", "puntos"));
  const omitido = [];
  if (lineasOmitidas) omitido.push(cuenta(lineasOmitidas, "línea", "líneas"));
  if (puntosOmitidos) omitido.push(cuenta(puntosOmitidos, "punto", "puntos"));
  const textoOmitido = omitido.length ? ` Se ${lineasOmitidas + puntosOmitidos === 1 ? "omite" : "omiten"} ${enLista(omitido)}.` : "";
  const texto = decididos === 0
    ? "Todavía no elegiste qué hacer con nada del archivo."
    : `Vas a sumar ${vaASumar.length ? enLista(vaASumar) : "nada"}.${textoOmitido}`;
  return { problemas, texto, listo: problemas.length === 0 && total > 0, vaASumar, total };
}

function svgVistaPrevia() {
  const t = estado.traer;
  const archivo = ARCHIVOS[t.archivo];
  const lineaEnfocada = t.foco?.tipo === "linea";
  const tf = lineaEnfocada ? encuadre(archivo.lineas[t.foco.i].p, 1000, 620, 90) : (p) => p;
  let svg = `<svg viewBox="0 0 1000 620" role="img" aria-label="Vista previa de lo que trae el archivo"><rect width="1000" height="620" fill="var(--mapa-fondo)"/>${relieve(1000, 620)}`;
  archivo.lineas.forEach((linea, i) => {
    if (lineaEnfocada && i === t.foco.i) return;
    const omitida = t.decisiones[i] === "omitir";
    const arr = linea.p.map(tf);
    svg += `<polyline points="${pts(arr)}" fill="none" stroke="var(--otra-actividad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="${t.foco ? 0.4 : 1}" ${omitida ? 'stroke-dasharray="2 6"' : ""}/>
      <polyline points="${pts(arr)}" fill="none" stroke="transparent" stroke-width="18" class="tocable" pointer-events="stroke" data-accion="enfocar" data-valor="linea-${i}"><title>${esc(t.nombres[i])}</title></polyline>`;
  });
  if (lineaEnfocada) {
    const arr = archivo.lineas[t.foco.i].p.map(tf);
    const medio = arr[Math.floor(arr.length / 2)];
    svg += `<polyline points="${pts(arr)}" fill="none" stroke="var(--linea-borde)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="${pts(arr)}" fill="none" stroke="var(--dato)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${arr[0][0]}" cy="${arr[0][1]}" r="7" fill="var(--dato)" stroke="var(--parte-x-halo)" stroke-width="2"/>
      <text class="etiqueta-mapa" style="font-size:28px;stroke-width:6px" x="${medio[0] + 14}" y="${medio[1] - 12}">${t.foco.i + 1} · ${esc(t.nombres[t.foco.i])}</text>`;
  }
  archivo.puntos.forEach((punto, i) => {
    const enfocado = t.foco?.tipo === "punto" && t.foco.i === i;
    const [x, y] = tf(punto.pos);
    if (enfocado) svg += `<circle cx="${x}" cy="${y}" r="24" fill="var(--dato)" fill-opacity="0.3"/>`;
    svg += `<g class="tocable" data-accion="enfocar" data-valor="punto-${i}" opacity="${t.puntos[i] === "omitir" ? 0.45 : 1}">${iconoSvg(t.iconos[i], x, y, true)}<title>${esc(punto.nombre)}</title></g>`;
    if (enfocado) svg += `<text class="etiqueta-mapa" style="font-size:28px;stroke-width:6px" x="${x + 22}" y="${y + 9}">P${i + 1} · ${esc(punto.nombre)}</text>`;
  });
  return svg + "</svg>";
}

function filaDeLinea(linea, i) {
  const t = estado.traer;
  const decision = t.decisiones[i];
  const enfocada = t.foco?.tipo === "linea" && t.foco.i === i;
  const largo = caracteres(t.nombres[i].trim());
  const pill = !decision ? `<span class="estado-pill falta">Falta decidir</span>`
    : decision === "omitir" ? `<span class="estado-pill omitida">Se omite</span>`
    : decision === "trazo" && !t.colores[i] ? `<span class="estado-pill falta">Falta el color</span>`
    : `<span class="estado-pill listo">${decision === "camino" ? "Camino" : "Trazo"}</span>`;
  return `<div class="linea-a-traer ${enfocada ? "enfocada" : ""}" id="linea-${i}">
    <div class="cabeza"><span class="numero">${i + 1}</span>
      <span class="color-earth" title="Color que tenía en Google Earth"><i style="background:${linea.color}"></i>Color en Google Earth</span>
      ${pill}</div>
    <div class="fila" style="align-items:flex-start">
      <div style="flex:1;min-width:220px"><label class="campo" for="nombre-${i}">Nombre</label>
        <input type="text" id="nombre-${i}" data-campo="nombre-linea" data-i="${i}" value="${esc(t.nombres[i])}" ${decision === "omitir" ? "disabled" : ""}>
        <p class="contador ${largo > 120 ? "pasado" : ""}" id="contador-linea-${i}">${largo} de 120 caracteres</p></div>
      <span class="chico suave" style="padding-top:36px">${km(linea.km)}</span>
      <button class="boton fantasma" style="margin-top:28px" data-accion="enfocar" data-valor="linea-${i}">${enfocada ? "Viéndola" : "Ver en el mapa"}</button>
    </div>
    <div class="opciones c3" style="margin-top:8px" role="group" aria-label="Qué hacer con la línea ${i + 1}">
      ${[["camino", "Camino"], ["trazo", "Trazo de referencia"], ["omitir", "Omitir"]].map(([valor, texto]) =>
        `<button class="opcion" data-accion="decidir" data-i="${i}" data-valor="${valor}" aria-pressed="${decision === valor}">${texto}</button>`).join("")}
    </div>
    ${decision === "trazo" ? `<div style="margin-top:8px"><p class="chico suave" style="margin-bottom:6px">Color del trazo</p>
      <div class="opciones c4">${TRAZOS_COLOR.map((c) => `<button class="opcion" data-accion="color-trazo" data-i="${i}" data-valor="${c.id}" aria-pressed="${t.colores[i] === c.id}"><i style="width:14px;height:14px;border-radius:4px;background:${c.color};display:inline-block"></i>${c.nombre}</button>`).join("")}</div></div>` : ""}
  </div>`;
}

function filaDePunto(punto, i) {
  const t = estado.traer;
  const decision = t.puntos[i];
  const enfocado = t.foco?.tipo === "punto" && t.foco.i === i;
  const pill = !decision ? `<span class="estado-pill falta">Falta decidir</span>`
    : decision === "omitir" ? `<span class="estado-pill omitida">Se omite</span>`
    : `<span class="estado-pill listo">Se suma</span>`;
  return `<div class="linea-a-traer ${enfocado ? "enfocada" : ""}" id="punto-${i}">
    <div class="cabeza"><span class="numero">P${i + 1}</span><b>${esc(punto.nombre)}</b>${pill}</div>
    <p class="chico suave">Lo que dice el archivo queda como comentario del punto. El ícono se propone por el nombre y lo podés cambiar.</p>
    <div class="opciones c3" style="margin-top:8px" role="group" aria-label="Ícono del punto P${i + 1}">
      ${["mirador", "cumbre", "refugio", "fuente", "cascada", "tranquera"].map((icono) => `<button class="opcion" data-accion="icono-punto" data-i="${i}" data-valor="${icono}" aria-pressed="${t.iconos[i] === icono}" ${decision === "omitir" ? "disabled" : ""}>${ICONOS[icono].nombre}</button>`).join("")}
    </div>
    <div class="opciones c3" style="margin-top:8px" role="group" aria-label="Qué hacer con el punto P${i + 1}">
      <button class="opcion" data-accion="decidir-punto" data-i="${i}" data-valor="sumar" aria-pressed="${decision === "sumar"}">Sumar el punto</button>
      <button class="opcion" data-accion="decidir-punto" data-i="${i}" data-valor="omitir" aria-pressed="${decision === "omitir"}">Omitir</button>
      <button class="opcion" data-accion="enfocar" data-valor="punto-${i}" aria-pressed="${enfocado}">Ver en el mapa</button>
    </div>
  </div>`;
}

function renderTraer() {
  const t = estado.traer;
  const archivo = ARCHIVOS[t.archivo];
  const vista = document.getElementById("vista-traer");
  if (!puedeCrear()) {
    vista.innerHTML = `<div class="tarjeta franja-ambar pila"><h2 style="font-size:18px">Traer de afuera</h2>
      <p>Tu cuenta puede ver los Caminos, los puntos y los trazos, pero no sumarlos. Los suman los usuarios Premium y el administrador: si conocés algo que falta, pasáselo a Ale.</p>
      <button class="boton secundario" data-accion="volver-traer">Volver a ${estado.traerDesde === "anotaciones" ? "Anotaciones" : "Caminos"}</button></div>`;
    return;
  }
  if (t.incorporado) {
    const r = resumenTraer();
    const unoSolo = r.total === 1;
    vista.innerHTML = `<div class="pila">
      <div class="tarjeta franja-verde pila"><h2 style="font-size:18px">Listo</h2>
        <p>Se ${unoSolo ? "sumó" : "sumaron"} ${enLista(r.vaASumar)}. Ya se ${unoSolo ? "ve" : "ven"} en el mapa.</p>
        <p class="chico suave">Lo que omitiste no se guardó, y el archivo tampoco.</p>
        <div class="fila"><button class="boton principal" data-accion="pestana" data-valor="mapa">Ver en el mapa</button>
          <button class="boton secundario" data-accion="traer-otro">Traer otro archivo</button></div></div>
      <p class="nota-boceto">En el boceto el mapa general no cambia: muestra siempre el mismo ejemplo. Si algo no se pudiera guardar, en vez de «Listo» se ve el aviso de la situación 5.</p>
    </div>`;
    return;
  }

  const r = resumenTraer();
  let paso = 1;
  const titulo = (texto) => `<p class="titulo-seccion" style="margin:0">${paso++} · ${texto}</p>`;
  const resumenDelArchivo = [
    archivo.lineas.length ? cuenta(archivo.lineas.length, "línea", "líneas") : "ninguna línea",
    archivo.puntos.length ? cuenta(archivo.puntos.length, "punto", "puntos") : "ningún punto",
    "nada se salteó",
  ].join(" · ");
  const tarjetaArchivo = `<div class="tarjeta pila-chica">
      ${titulo("El archivo")}
      <div class="fila entre"><p><b>${esc(archivo.nombre)}</b> · ${resumenDelArchivo}</p>
        <button class="boton secundario" data-accion="nada">Elegir otro archivo</button></div>
      <p class="chico suave">Sirven archivos .kml, .kmz y .gpx. El archivo no se guarda: solo queda lo que sumes.</p>
      ${archivo.inventado ? `<p class="nota-boceto">Archivo inventado para el boceto, para ver cómo se trae uno que solo tiene puntos. No es un archivo de Ale.</p>` : ""}
    </div>`;
  const tarjetaActividades = archivo.lineas.length ? `<div class="tarjeta pila-chica">
      ${titulo("Para qué sirven los Caminos nuevos")}
      <div class="opciones c5">${ACTIVIDADES.map((a) => `<button class="opcion" data-accion="actividad-traer" data-valor="${a.id}" aria-pressed="${t.actividades.includes(a.id)}">${esc(a.nombre)}</button>`).join("")}</div>
      <p class="chico suave">Vale para todas las líneas que marques como Camino. Después podés cambiarlo en cada uno.</p>
    </div>` : "";
  const bloqueLineas = archivo.lineas.length ? `${titulo("Qué hacer con cada línea")}
      <p class="chico suave">Cada línea es una alternativa aparte: no se suman entre sí. El color de Google Earth no decide nada.</p>
      ${archivo.lineas.map(filaDeLinea).join("")}` : "";
  const bloquePuntos = archivo.puntos.length ? `${titulo("Qué hacer con cada punto")}
      <p class="chico suave">Un punto no necesita zona ni sector.</p>
      ${archivo.puntos.map(filaDePunto).join("")}`
    : `<p class="nota-boceto">Este archivo no trae puntos. Para ver cómo se trae uno que sí trae, elegí arriba «2b · Archivo con puntos».</p>`;
  const textoDelMapa = !t.foco
    ? (archivo.lineas.length ? "Tocá una línea o «Ver en el mapa» para verla de cerca." : "Tocá un punto o «Ver en el mapa» para ubicarlo.")
    : t.foco.tipo === "punto" ? `Estás viendo el punto P${t.foco.i + 1}.`
    : `Estás viendo la línea ${t.foco.i + 1}, con su comienzo marcado. Las demás quedan apagadas.`;

  vista.innerHTML = `<div class="pila">
    <div class="fila entre"><div class="fila"><button class="boton fantasma" data-accion="volver-traer">← Volver a ${estado.traerDesde === "anotaciones" ? "Anotaciones" : "Caminos"}</button><h2 style="font-size:20px">Traer de afuera</h2></div></div>
    ${tarjetaArchivo}
    ${tarjetaActividades}
    <div class="traer">
      <div class="pila">${bloqueLineas}${bloquePuntos}</div>
      <div class="vista-previa pila-chica">
        <div class="mapa-caja ${estado.enGrande === "previa" ? "en-grande" : ""}">${svgVistaPrevia()}${controlesDeMapa("previa")}</div>
        <p class="chico suave">${textoDelMapa}</p>
      </div>
    </div>
    <div class="tarjeta pila-chica ${r.problemas.length ? "franja-ambar" : "franja-verde"}" id="resumen-traer">${resumenHtml(r)}</div>
  </div>`;
}
function resumenHtml(r) {
  return `<p><b id="resumen-texto">${esc(r.texto)}</b></p>
    ${r.problemas.map((p) => `<p class="chico">${esc(p)}</p>`).join("")}
    <div class="fila"><button class="boton principal" data-accion="incorporar" ${r.listo ? "" : "disabled"}>Sumar al mapa</button>
      <button class="boton secundario" data-accion="volver-traer">Cancelar</button></div>`;
}

// ---------------------------------------------------------------- vista: editor
function editorBloqueado(camino) {
  if (puedeEditar(camino)) return "";
  const texto = estado.rol === "normal"
    ? "Tu cuenta puede ver los Caminos, pero no cambiarlos."
    : `Este Camino lo subió ${AUTORES[camino.autor]}: solo podés cambiar los tuyos. Si hay algo para corregir, avisale al administrador.`;
  return `<div class="tarjeta franja-ambar"><p>${esc(texto)}</p></div>
    <p class="nota-boceto">En la app esta pantalla ni se ofrece a quien no puede editar. Se muestra para ver qué pasa si alguien llega igual.</p>`;
}

function svgEditor(modo) {
  const e = estado.editor;
  const preferida = modo === "partes" ? e.actividadPartes : estado.actividadPrincipal;
  const act = e.camino.actividades.includes(preferida) ? preferida : e.camino.actividades[0];
  let svg = `<svg viewBox="0 0 800 520" role="img" aria-label="Línea del Camino" id="svg-editor"><rect width="800" height="520" fill="var(--mapa-fondo)"/>${relieve(800, 520)}`;
  e.camino.partes.forEach((parte, i) => {
    const arr = e.coords.slice(parte.desde, parte.hasta + 1);
    if (modo === "partes" && i === e.parte) {
      svg += `<polyline points="${pts(arr)}" fill="none" stroke="var(--dato)" stroke-width="20" stroke-opacity="0.35" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
    svg += lineaDeParte(arr, parte.por[act] || cl("por_explorar", null), 7);
    if (modo === "partes" || !e.corrigiendo) {
      svg += `<polyline points="${pts(arr)}" fill="none" stroke="transparent" stroke-width="20" class="tocable" pointer-events="stroke" data-accion="${modo === "partes" ? "tocar-parte-editor" : "nada"}" data-parte="${i}"/>`;
    }
  });
  if (modo === "partes") {
    e.camino.partes.forEach((parte) => {
      const [x, y] = e.coords[parte.desde];
      if (parte.desde !== 0) svg += `<circle cx="${x}" cy="${y}" r="4" fill="var(--superficie)" stroke="var(--texto)" stroke-width="2" pointer-events="none"/>`;
    });
    e.marcas.forEach((indice, n) => {
      const [x, y] = e.coords[indice];
      svg += `<circle cx="${x}" cy="${y}" r="9" fill="var(--dato)" stroke="var(--parte-x-halo)" stroke-width="3"/>
        <text class="etiqueta-mapa" x="${x + 12}" y="${y - 10}">${n === 0 ? "Inicio" : "Final"}</text>`;
    });
  }
  if (modo === "datos" && e.corrigiendo) {
    e.coords.forEach(([x, y], i) => {
      svg += `<circle cx="${x}" cy="${y}" r="7" fill="var(--superficie)" stroke="var(--dato)" stroke-width="3" class="tocable" data-vertice="${i}"/>`;
    });
  }
  return svg + "</svg>";
}

function renderEditor() {
  const e = estado.editor;
  const camino = e.camino;
  const vista = document.getElementById("vista-editor");
  if (e.retirado) {
    vista.innerHTML = `<div class="tarjeta franja-ambar pila-chica"><p>Ese Camino fue retirado del mapa. Volvé a la lista de Caminos.</p>

      <p class="nota-boceto" style="margin-top:12px">No hay botón para recuperarlo, tampoco para el administrador. Usá «Reiniciar el boceto» arriba para volver a verlo.</p>`;
    return;
  }
  const bloqueo = editorBloqueado(camino);
  const deshabilitado = bloqueo ? "disabled" : "";
  const cabecera = `<div class="fila entre">
      <div class="fila"><button class="boton fantasma" data-accion="volver-caminos">← Volver a Caminos</button>
        <h2 style="font-size:20px">${esc(camino.nombre)}</h2></div>
      <div class="fila" role="tablist" aria-label="Partes del editor">

      </div></div>`;

  if (estado.subEditor === "datos") {
    const largoNombre = caracteres(e.nombre.trim());
    const largoDescripcion = caracteres(e.descripcion);
    vista.innerHTML = `<div class="pila">${cabecera}${bloqueo}
      ${estado.notaEditor ? '<p class="nota-boceto">El boceto abre siempre el mismo Camino de ejemplo, «Camino cuadrado - alpatuca».</p>' : ""}
      <div class="editor">
        <div class="tarjeta pila">
          <div><label class="campo" for="campo-nombre">Nombre</label>
            <input type="text" id="campo-nombre" data-campo="nombre" value="${esc(e.nombre)}" ${deshabilitado}>
            <p class="contador ${largoNombre > 120 ? "pasado" : ""}" id="contador-nombre">${largoNombre} de 120 caracteres</p></div>
          <div><label class="campo" for="campo-descripcion">Descripción</label>
            <textarea id="campo-descripcion" data-campo="descripcion" ${deshabilitado}>${esc(e.descripcion)}</textarea>
            <p class="contador ${largoDescripcion > 2000 ? "pasado" : ""}" id="contador-descripcion">${conMiles(largoDescripcion)} de 2.000 caracteres</p></div>
          <div><p class="campo">Sirve para (al menos una)</p>
            <div class="opciones c2">${ACTIVIDADES.map((a) => `<button class="opcion" data-accion="actividad-editor" data-valor="${a.id}" aria-pressed="${e.actividades.includes(a.id)}" ${deshabilitado}>${esc(a.nombre)}</button>`).join("")}</div></div>
          ${e.pendienteSacar ? `<div class="aviso-ambar pila-chica"><p>Si sacás ${esc(nombreActividad(e.pendienteSacar))}, se borra su condición y su complejidad en las ${camino.partes.length} partes. La observación y la fecha de cada parte quedan.</p>
            <div class="fila"><button class="boton destructivo" data-accion="confirmar-sacar">Sacar ${esc(nombreActividad(e.pendienteSacar))}</button>
            <button class="boton secundario" data-accion="cancelar-sacar">Dejarla</button></div></div>` : ""}
          ${e.errorDatos ? `<p class="aviso-rojo" role="alert">${esc(e.errorDatos)}</p>` : ""}
          ${e.datosGuardados ? `<p class="aviso-verde" role="status">Se guardaron los cambios.</p>` : ""}
          <p class="chico suave">Lo subió ${esc(AUTORES[camino.autor])} el 5 de octubre de 2026.</p>
          ${bloqueo ? "" : `<div class="fila entre"><button class="boton principal" data-accion="guardar-datos">Guardar cambios</button>

        </div>
        <div class="pila-chica">
          <div class="mapa-caja ${estado.enGrande === "editor" ? "en-grande" : ""}">${svgEditor("datos")}${e.corrigiendo ? "" : controlesDeMapa("editor")}</div>
          ${e.corrigiendo
            ? `<div class="tarjeta pila-chica"><p><b>Corrigiendo la línea.</b> Arrastrá los puntos para ubicarlos donde va de verdad.</p>
                <p class="chico suave">Es el mismo Camino. Cada parte conserva su condición, complejidad, observación y fecha.</p>
                <div class="fila"><button class="boton principal" data-accion="guardar-linea">Guardar la línea corregida</button>
                <button class="boton secundario" data-accion="cancelar-linea">Cancelar</button></div></div>`
            : `${leyendaDePartes(estado.actividadPrincipal)}
               ${e.lineaGuardada ? `<p class="aviso-verde" role="status">La línea quedó corregida. Es el mismo Camino y sus ${camino.partes.length} partes conservan condición, complejidad, observación y fecha.</p>` : ""}
               ${bloqueo ? "" : `<div class="fila"><button class="boton secundario" data-accion="corregir-linea">Corregir la línea</button></div>`}`}

  vista.innerHTML = `<div class="pila">${cabecera}${bloqueo}
    <div class="tarjeta pila-chica">
      <p class="titulo-seccion" style="margin:0">Actividad que estás clasificando</p>

          : bloqueo ? "" : `<div class="fila"><button class="boton secundario" data-accion="partir">Partir una parte</button></div>`}
        <div class="lista-partes">${camino.partes.map((p, i) => {
          const c = p.por[act];
          return `<button class="renglon-parte" data-accion="elegir-parte" data-parte="${i}" aria-pressed="${i === e.parte}">
            ${muestraDeLinea(c.paso, c.comp)}<span class="chico"><b>Parte ${i + 1}</b> · km ${acum[p.desde].toFixed(1).replace(".", ",")} a ${acum[p.hasta].toFixed(1).replace(".", ",")} · ${esc(nombrePaso(c.paso, act))} · ${esc(nombreComplejidad(c.comp))}</span></button>`;
        }).join("")}</div>

        <fieldset style="border:0;padding:0;margin:0" class="pila-chica"><legend class="campo">Condición de paso para ${esc(nombreActividad(act))}</legend>

        <fieldset style="border:0;padding:0;margin:0" class="pila-chica"><legend class="campo">Complejidad para ${esc(nombreActividad(act))}</legend>

        ${clasif.paso === "sin_paso" ? `<p class="chico suave">Sin paso se marca con X sobre la línea. El color sigue diciendo la complejidad: la X no la vuelve roja.</p>` : ""}

          <table class="tabla-actividades"><tbody>${otras.map((a) => `<tr><td>${esc(nombreActividad(a))}</td><td><span class="fila">${muestraDeLinea(parte.por[a].paso, parte.por[a].comp)}${esc(nombrePaso(parte.por[a].paso, a))} · ${esc(nombreComplejidad(parte.por[a].comp))}</span>

            <p class="contador ${caracteres(parte.obs) > 1000 ? "pasado" : ""}" id="contador-observacion">${conMiles(caracteres(parte.obs))} de 1.000 caracteres</p>

          <p class="aviso-rojo ${fechaFutura ? "" : "oculto"}" role="alert" id="error-fecha">La fecha de comprobación es más adelante que hoy. Elegí el día en que pasaste por ahí.</p>

}

// ---------------------------------------------------------------- emergente única
function abrirEmergente(titulo, texto, botones) {
  const caja = document.getElementById("emergente");
  caja.innerHTML = `<h2 id="emergente-titulo">${esc(titulo)}</h2><p>${esc(texto)}</p>
    <div class="botones">${botones.map((b) => `<button class="boton ${b.variante}" data-accion="${b.accion}">${esc(b.texto)}</button>`).join("")}</div>`;
  document.getElementById("velo").classList.remove("oculto");
  caja.querySelector("button")?.focus();
}
function cerrarEmergente() {
  document.getElementById("velo").classList.add("oculto");
}
function pedirRetiro(desdeEstados) {
  const camino = estado.editor.camino;
  abrirEmergente(
    `¿Retirar «${camino.nombre}»?`,
    "Deja de verse en el mapa y en la lista, para todos. No se puede recuperar desde la app.",
    [
      { texto: "Cancelar", variante: "secundario", accion: "cerrar-emergente" },
      { texto: "Sí, retirar", variante: "destructivo", accion: desdeEstados ? "cerrar-emergente" : "confirmar-retiro" },
    ],
  );
}

// ---------------------------------------------------------------- render general
const SITUACIONES = { 1: ["mapa"], 2: ["traer"], "2b": ["traer"], 3: ["editor", "datos"], 4: ["editor", "partes"], 5: ["estados"] };

/** «2» es el archivo de Ascochinga; «2b», el de ejemplo con solo puntos. */
function elegirArchivo(situacion) {
  const archivo = situacion === "2b" ? "puntos" : "ascochinga";
  estado.traerDesde = situacion === "2b" ? "anotaciones" : "caminos";
  if (estado.traer.archivo !== archivo || estado.traer.incorporado) estado.traer = nuevoTraer(archivo);
}

function render() {
  document.documentElement.dataset.modo = estado.modo;
  document.getElementById("boton-modo").textContent = estado.modo === "noche" ? "Cambiar a modo sol" : "Cambiar a modo noche";
  const persona = yo();
  document.getElementById("quien-usa").textContent = `${persona.nombre} · ${persona.categoria}`;

  const pestanaActiva = { mapa: "mapa", caminos: "caminos", traer: estado.traerDesde, editor: "caminos", estados: null }[estado.vista] ?? estado.vista;
  for (const boton of document.querySelectorAll('[data-accion="pestana"]')) {
    const activa = boton.dataset.valor === pestanaActiva;
    boton.className = `boton ${activa ? "principal" : "fantasma"}`;
    boton.setAttribute("aria-selected", String(activa));
  }

  const situacion = estado.vista === "mapa" ? "1" : estado.vista === "traer" ? (estado.traer.archivo === "puntos" ? "2b" : "2") : estado.vista === "editor" ? (estado.subEditor === "datos" ? "3" : "4") : estado.vista === "estados" ? "5" : "";
  for (const boton of document.querySelectorAll('[data-accion="situacion"]')) boton.setAttribute("aria-pressed", String(boton.dataset.valor === situacion));
  for (const boton of document.querySelectorAll('[data-accion="rol"]')) boton.setAttribute("aria-pressed", String(boton.dataset.valor === estado.rol));

  const vistas = { mapa: renderMapa, caminos: renderCaminos, traer: renderTraer, editor: renderEditor, anotaciones: renderAnotaciones, estados: renderEstados };
  for (const nombre of ["mapa", "caminos", "traer", "editor", "anotaciones", "estados", "otra"]) {
    document.getElementById(`vista-${nombre}`).classList.toggle("oculto", nombre !== (vistas[estado.vista] ? estado.vista : "otra"));
  }
  if (vistas[estado.vista]) vistas[estado.vista]();
  else renderOtra(estado.vista === "zonas" ? "Zonas" : "Descargas");
}

// ---------------------------------------------------------------- acciones
document.addEventListener("click", (evento) => {
  const elemento = evento.target.closest("[data-accion]");
  if (!elemento) return;
  const { accion, valor } = elemento.dataset;
  const e = estado.editor;
  const t = estado.traer;
  if (accion === "cerrar-emergente-afuera") {
    if (evento.target === elemento) cerrarEmergente();
    return;
  }
  switch (accion) {
    case "situacion": {
      const [vista, sub] = SITUACIONES[valor];
      estado.vista = vista;
      if (sub) estado.subEditor = sub;
      if (vista === "traer") elegirArchivo(valor);
      estado.enGrande = null;
      estado.notaEditor = false;
      break;
    }
    case "rol": estado.rol = valor; break;
    case "reiniciar": { const modo = estado.modo; estado = estadoInicial(); estado.modo = modo; break; }
    case "modo": estado.modo = estado.modo === "noche" ? "sol" : "noche"; break;
    case "pestana":
      estado.vista = valor; estado.enGrande = null;
      estado.avisoLista = valor === "caminos" ? estado.avisoLista : null;
      estado.avisoAnotaciones = valor === "anotaciones" ? estado.avisoAnotaciones : null;
      break;
    case "ver-anotacion": estado.vista = "mapa"; estado.seleccion = { tipo: elemento.dataset.tipo, id: elemento.dataset.id }; break;
    case "borrar-anotacion": {
      const anotacion = anotacionesVivas().find((a) => a.id === elemento.dataset.id);
      if (!anotacion || !puedeEditarAnotacion(anotacion)) return;
      estado.anotacionABorrar = anotacion.id;
      abrirEmergente(`¿Borrar «${anotacion.nombre}»?`, "Deja de verse en todos los mapas, para todos.", [
        { texto: "Cancelar", variante: "secundario", accion: "cerrar-emergente" },
        { texto: "Sí, borrar", variante: "destructivo", accion: "confirmar-borrar-anotacion" },
      ]);
      return;
    }
    case "confirmar-borrar-anotacion": {
      cerrarEmergente();
      const anotacion = anotacionesVivas().find((a) => a.id === estado.anotacionABorrar);
      if (anotacion) {
        estado.anotacionesBorradas.push(anotacion.id);
        estado.avisoAnotaciones = `Se borró «${anotacion.nombre}». Ya no aparece en el mapa.`;
      }
      if (estado.seleccion?.id === estado.anotacionABorrar) estado.seleccion = null;
      estado.anotacionABorrar = null;
      break;
    }
    case "principal": estado.actividadPrincipal = valor; break;
    case "acercar": estado.acercamiento = "cerca"; break;
    case "alejar": estado.acercamiento = "lejos"; break;
    case "agrandar": estado.enGrande = estado.enGrande === valor ? null : valor; break;
    case "tocar-camino": estado.seleccion = { tipo: "camino", id: Number(elemento.dataset.id), parte: Number(elemento.dataset.parte) }; break;
    case "tocar-punto": estado.seleccion = { tipo: "punto", id: elemento.dataset.id }; break;
    case "tocar-trazo": estado.seleccion = { tipo: "trazo", id: elemento.dataset.id }; break;
    case "tocar-zona": estado.seleccion = { tipo: "zona" }; break;
    case "abrir-editor": estado.vista = "editor"; estado.subEditor = valor; estado.enGrande = null; estado.notaEditor = estado.seleccion?.id !== 5; break;
    case "ver-en-mapa": estado.vista = "mapa"; estado.seleccion = { tipo: "camino", id: Number(elemento.dataset.id), parte: 0 }; break;
    case "editar-camino": estado.vista = "editor"; estado.subEditor = "datos"; estado.notaEditor = Number(elemento.dataset.id) !== 5; break;
    case "ir-traer": estado.vista = "traer"; elegirArchivo(valor === "puntos" ? "2b" : "2"); break;
    case "volver-caminos": estado.vista = "caminos"; estado.enGrande = null; break;
    case "volver-traer": estado.vista = estado.traerDesde; estado.enGrande = null; break;
    case "traer-otro": estado.traer = nuevoTraer(estado.traer.archivo); break;
    case "enfocar": {
      const [tipo, numero] = valor.split("-");
      const i = Number(numero);
      t.foco = t.foco?.tipo === tipo && t.foco.i === i ? null : { tipo, i };
      break;
    }
    case "decidir": t.decisiones[Number(elemento.dataset.i)] = valor; t.foco = { tipo: "linea", i: Number(elemento.dataset.i) }; break;
    case "color-trazo": t.colores[Number(elemento.dataset.i)] = valor; break;
    case "actividad-traer": t.actividades = t.actividades.includes(valor) ? t.actividades.filter((a) => a !== valor) : [...t.actividades, valor]; break;
    case "decidir-punto": t.puntos[Number(elemento.dataset.i)] = valor; t.foco = { tipo: "punto", i: Number(elemento.dataset.i) }; break;
    case "icono-punto": t.iconos[Number(elemento.dataset.i)] = valor; break;
    case "incorporar": if (resumenTraer().listo) t.incorporado = true; break;
    case "sub-editor": estado.subEditor = valor; estado.enGrande = null; break;
    case "actividad-editor": {
      e.datosGuardados = false; e.errorDatos = null;
      if (!e.actividades.includes(valor)) { e.actividades = [...e.actividades, valor]; e.pendienteSacar = null; break; }
      if (e.actividades.length === 1) { e.errorDatos = "Elegí al menos una actividad para este Camino."; break; }
      if (e.camino.actividades.includes(valor)) { e.pendienteSacar = valor; break; }
      e.actividades = e.actividades.filter((a) => a !== valor);
      break;
    }
    case "confirmar-sacar": e.actividades = e.actividades.filter((a) => a !== e.pendienteSacar); e.pendienteSacar = null; break;
    case "cancelar-sacar": e.pendienteSacar = null; break;
    case "guardar-datos": {
      const nombre = e.nombre.trim();
      e.errorDatos = !nombre ? "Ponele un nombre al Camino."
        : caracteres(nombre) > 120 ? `El nombre es muy largo: tiene ${caracteres(nombre)} caracteres y el máximo son 120. Acortalo.`
        : caracteres(e.descripcion) > 2000 ? "La descripción es muy larga: dejala en 2.000 caracteres o menos."
        : e.actividades.length === 0 ? "Elegí al menos una actividad para este Camino." : null;
      if (!e.errorDatos) {
        for (const parte of e.camino.partes) {
          for (const a of e.actividades) if (!parte.por[a]) parte.por[a] = cl("por_explorar", null);
          for (const a of Object.keys(parte.por)) if (!e.actividades.includes(a)) delete parte.por[a];
        }
        e.camino.actividades = [...e.actividades];
        e.camino.nombre = nombre;
        e.camino.descripcion = e.descripcion;
        e.datosGuardados = true;
        sincronizarConElMapa();
      }
      break;
    }
    case "corregir-linea": e.corrigiendo = true; e.coordsAntes = e.coords.map((p) => [...p]); e.lineaGuardada = false; break;
    case "guardar-linea": e.corrigiendo = false; e.lineaGuardada = true; break;
    case "cancelar-linea": e.corrigiendo = false; e.coords = e.coordsAntes; break;
    case "retirar": pedirRetiro(false); return;
    case "ver-retirar": pedirRetiro(true); return;
    case "cerrar-emergente": cerrarEmergente(); return;
    case "confirmar-retiro": {
      cerrarEmergente();
      estado.caminos = estado.caminos.filter((c) => c.id !== e.camino.id);
      if (estado.seleccion?.id === e.camino.id) estado.seleccion = null;
      estado.avisoLista = `Se retiró «${e.camino.nombre}». Ya no aparece en el mapa ni en esta lista.`;
      e.retirado = true;
      estado.vista = "caminos";
      break;
    }
    case "actividad-partes": estado.editor.actividadPartes = valor; e.parteGuardada = null; break;
    case "tocar-parte-editor":
      if (e.partiendo) { marcarParaPartir(evento); break; }
      e.parte = Number(elemento.dataset.parte); e.parteGuardada = null; e.datosParteTocados = false;
      break;
    case "elegir-parte":
      e.parte = Number(elemento.dataset.parte); e.parteGuardada = null; e.datosParteTocados = false;
      break;
    case "paso": if (puedeEditar(e.camino)) { e.camino.partes[e.parte].por[e.actividadPartes].paso = valor; e.parteGuardada = null; } break;
    case "complejidad": if (puedeEditar(e.camino)) { e.camino.partes[e.parte].por[e.actividadPartes].comp = valor || null; e.parteGuardada = null; } break;
    case "guardar-parte": e.parteGuardada = e.parte; e.datosParteTocados = false; sincronizarConElMapa(); break;
    case "partir": e.partiendo = true; e.marcas = []; break;
    case "cancelar-partir": e.partiendo = false; e.marcas = []; break;
    case "confirmar-partir": partir(); break;
    case "nada": return;
    default: return;
  }
  render();
});

/** En el modo partir, cada toque sobre la línea deja una marca en el punto más cercano. */
function marcarParaPartir(evento) {
  const e = estado.editor;
  const svg = document.getElementById("svg-editor");
  const p = svg.createSVGPoint();
  p.x = evento.clientX; p.y = evento.clientY;
  const local = p.matrixTransform(svg.getScreenCTM().inverse());
  let mejor = 0;
  e.coords.forEach((c, i) => { if (Math.hypot(c[0] - local.x, c[1] - local.y) < Math.hypot(e.coords[mejor][0] - local.x, e.coords[mejor][1] - local.y)) mejor = i; });
  e.marcas = e.marcas.length >= 2 ? [mejor] : [...e.marcas, mejor];
}

function partir() {
  const e = estado.editor;
  if (e.marcas.length !== 2) return;
  const [a, b] = [...e.marcas].sort((x, y) => x - y);
  if (a === b) { e.marcas = []; return; }
  const nuevas = [];
  for (const parte of e.camino.partes) {
    let tramos = [[parte.desde, parte.hasta]];
    for (const corte of [a, b]) {
      tramos = tramos.flatMap(([d, h]) => (corte > d && corte < h ? [[d, corte], [corte, h]] : [[d, h]]));
    }
    for (const [d, h] of tramos) nuevas.push({ ...structuredClone(parte), desde: d, hasta: h });
  }
  e.camino.partes = nuevas;
  e.parte = nuevas.findIndex((p) => p.desde === a);
  e.partiendo = false;
  e.marcas = [];
  e.parteGuardada = null;
  sincronizarConElMapa();
}

/** Lo que se guarda en el editor se ve después en el mapa general (salvo la forma de la línea). */
function sincronizarConElMapa() {
  const e = estado.editor;
  const enElMapa = estado.caminos.find((c) => c.id === e.camino.id);
  if (!enElMapa) return;
  enElMapa.nombre = e.camino.nombre;
  enElMapa.descripcion = e.camino.descripcion;
  enElMapa.actividades = [...e.camino.actividades];
  enElMapa.partes = structuredClone(e.camino.partes);
}

// Lo que se escribe no redibuja todo: solo los contadores y avisos, para no perder el cursor.
document.addEventListener("input", (evento) => {
  const campo = evento.target.dataset?.campo;
  if (!campo) return;
  const e = estado.editor;
  const valor = evento.target.value;
  if (campo === "nombre-linea") {
    const i = Number(evento.target.dataset.i);
    estado.traer.nombres[i] = valor;
    const largo = caracteres(valor.trim());
    const contador = document.getElementById(`contador-linea-${i}`);
    contador.textContent = `${largo} de 120 caracteres`;
    contador.classList.toggle("pasado", largo > 120);
    const r = resumenTraer();
    const resumen = document.getElementById("resumen-traer");
    resumen.innerHTML = resumenHtml(r);
    resumen.classList.toggle("franja-ambar", r.problemas.length > 0);
    resumen.classList.toggle("franja-verde", r.problemas.length === 0);
    return;
  }
  if (campo === "nombre") {
    e.nombre = valor; e.datosGuardados = false;
    const largo = caracteres(valor.trim());
    const contador = document.getElementById("contador-nombre");
    contador.textContent = `${largo} de 120 caracteres`;
    contador.classList.toggle("pasado", largo > 120);
  }
  if (campo === "descripcion") {
    e.descripcion = valor; e.datosGuardados = false;
    const contador = document.getElementById("contador-descripcion");
    contador.textContent = `${conMiles(caracteres(valor))} de 2.000 caracteres`;
    contador.classList.toggle("pasado", caracteres(valor) > 2000);
  }
  if (campo === "observacion" || campo === "fecha") {
    const parte = e.camino.partes[e.parte];
    if (campo === "observacion") {
      parte.obs = valor;
      const contador = document.getElementById("contador-observacion");
      contador.textContent = `${conMiles(caracteres(valor))} de 1.000 caracteres`;
      contador.classList.toggle("pasado", caracteres(valor) > 1000);
      document.getElementById("error-observacion").classList.toggle("oculto", caracteres(valor) <= 1000);
    } else {
      parte.fecha = valor;
    }
    e.datosParteTocados = true;
    e.parteGuardada = null;
    const futura = parte.fecha && parte.fecha > HOY;
    document.getElementById("error-fecha").classList.toggle("oculto", !futura);
    document.getElementById("nota-datos-parte").classList.remove("oculto");
    const boton = document.getElementById("boton-guardar-parte");
    if (boton) boton.disabled = Boolean(futura) || caracteres(parte.obs) > 1000;
  }
});

// Corregir la línea: arrastrar los puntos. Las partes siguen pegadas a sus puntos.
let arrastrando = null;
document.addEventListener("pointerdown", (evento) => {
  const vertice = evento.target.closest?.("[data-vertice]");
  if (!vertice || !estado.editor.corrigiendo) return;
  arrastrando = Number(vertice.dataset.vertice);
  evento.preventDefault();
});
document.addEventListener("pointermove", (evento) => {
  if (arrastrando === null) return;
  const svg = document.getElementById("svg-editor");
  if (!svg) return;
  const p = svg.createSVGPoint();
  p.x = evento.clientX; p.y = evento.clientY;
  const local = p.matrixTransform(svg.getScreenCTM().inverse());
  estado.editor.coords[arrastrando] = [Math.max(0, Math.min(800, local.x)), Math.max(0, Math.min(520, local.y))];
  svg.outerHTML = svgEditor("datos");
});
document.addEventListener("pointerup", () => { arrastrando = null; });

// La tecla Escape hace lo que el botón físico de atrás: cierra la emergente o el mapa grande.
document.addEventListener("keydown", (evento) => {
  if (evento.key !== "Escape") return;
  if (!document.getElementById("velo").classList.contains("oculto")) { cerrarEmergente(); return; }
  if (estado.enGrande) { estado.enGrande = null; render(); }
});

// Para revisar o compartir una vista puntual, la dirección puede abrirla directo.
// Por ejemplo: caminos-en-mapas.html#situacion=4&modo=sol&rol=normal
function leerDireccion() {
  const datos = new URLSearchParams(location.hash.slice(1));
  const situacion = datos.get("situacion");
  if (SITUACIONES[situacion]) {
    const [vista, sub] = SITUACIONES[situacion];
    estado.vista = vista;
    if (sub) estado.subEditor = sub;
    if (vista === "traer") elegirArchivo(situacion);
  }
  if (datos.get("vista")) estado.vista = datos.get("vista");
  if (["sol", "noche"].includes(datos.get("modo"))) estado.modo = datos.get("modo");
  if (PERSONAS[datos.get("rol")]) estado.rol = datos.get("rol");
  if (ACTIVIDADES.some((a) => a.id === datos.get("principal"))) estado.actividadPrincipal = datos.get("principal");
  if (datos.get("cerca") === "1") estado.acercamiento = "cerca";
  if (datos.get("camino")) {
    const [id, parte] = datos.get("camino").split(".");
    estado.seleccion = { tipo: "camino", id: Number(id), parte: Number(parte || 0) };
  }
  if (datos.get("parte")) estado.editor.parte = Number(datos.get("parte"));
  if (datos.get("ejemplo") === "decidido") {
    const t = estado.traer;
    t.decisiones = { 0: "camino", 1: "camino", 2: "camino", 3: "omitir", 4: "camino", 5: "camino", 6: "trazo" };
    t.actividades = ["mountain_bike"];
    t.foco = { tipo: "linea", i: 6 };
  }
  if (datos.get("corrigiendo") === "1") {
    const e = estado.editor;
    e.corrigiendo = true;
    e.coordsAntes = e.coords.map((p) => [...p]);
    e.coords[18] = [e.coords[18][0] + 40, e.coords[18][1] - 30];
  }
}

leerDireccion();
render();
</script>
